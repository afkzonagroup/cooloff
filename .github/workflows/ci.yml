name: CI

# Runs on pull requests and on demand only. No push or scheduled runs.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
      - run: node scripts/check-pack.mjs "$RUNNER_TEMP/pack.json"
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run build && npm pack --dry-run

  woocommerce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts && npm run build
      - name: PHP unit tests and coding standards
        run: connectors/woocommerce/bin/test.sh
      - name: WordPress and WooCommerce end-to-end test
        run: connectors/woocommerce/tests/integration/run.sh

  medusa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            connectors/medusa/package-lock.json
      - run: npm ci --ignore-scripts && npm run build
      - run: npm ci --ignore-scripts
        working-directory: connectors/medusa
      - run: npm run check
        working-directory: connectors/medusa
      - name: Medusa end-to-end test
        run: connectors/medusa/integration-tests/run.sh
